# Every published port below is bound explicitly to 127.0.0.1, not left to
# default to all interfaces. This is required, not just a hardening nicety:
# on macOS, "localhost" resolves to ::1 (IPv6) before 127.0.0.1, and Docker
# Desktop's IPv6 port-forwarding to a container process bound only to
# 0.0.0.0 (IPv4) can silently accept the connection and then never service
# it — the browser (or curl) hangs indefinitely instead of failing. Binding
# the host side to 127.0.0.1 makes an IPv6 attempt fail immediately, so
# browsers fall back to IPv4 (Happy Eyeballs) right away instead of hanging
# — this is what "the frontend is stuck in a loading loop" turned out to be.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sita}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sita}
      POSTGRES_DB: ${POSTGRES_DB:-sita}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sita}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # No API key required — this is a fully local model runtime.
    # After first `docker compose up`, pull the model with:
    #   docker compose exec ollama ollama pull llama3.1:8b-instruct-q4_K_M
    healthcheck:
      # Succeeds once the daemon is up, regardless of whether a model has
      # been pulled yet — pulling one is a separate, optional step, never
      # a hard dependency (see DEF.md § Phase 15).
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sita}:${POSTGRES_PASSWORD:-sita}@postgres:5432/${POSTGRES_DB:-sita}
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      # Deliberately not a hard dependency on ollama's health — MockProvider
      # is the real default, and requiring Ollama to be healthy before the
      # backend starts would make the zero-LLM-dependency default a lie at
      # the compose-file level. See DEF.md § Phase 15.
    volumes:
      - ./backend/app:/app/app
      # Read-only: lets scripts/demo.sh load the synthetic datasets via the
      # existing batch-import CLI without baking data/ into the image.
      - ./data:/data:ro
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:5173', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  postgres_data:
  ollama_data:
