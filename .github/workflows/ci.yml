name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: Backend / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Ruff check
        working-directory: backend
        run: uv run ruff check .
      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check .

  backend-test:
    name: Backend / test
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Alembic upgrade head (SQLite smoke test)
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: uv run alembic upgrade head
      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci.db
          LLM_PROVIDER: mock
        run: uv run pytest --cov=app --cov-report=term-missing

  backend-migrations-postgres:
    name: Backend / migrations (Postgres)
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sita
          POSTGRES_PASSWORD: sita
          POSTGRES_DB: sita
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sita"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Alembic upgrade head (Postgres)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://sita:sita@localhost:5432/sita
        run: uv run alembic upgrade head

  frontend-lint-build:
    name: Frontend / lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: Prettier check
        working-directory: frontend
        run: npm run format:check
      - name: Build
        working-directory: frontend
        run: npm run build
