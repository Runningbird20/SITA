name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: Backend / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Ruff check
        working-directory: backend
        run: uv run ruff check .
      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check .

  backend-dependency-scan:
    name: Backend / dependency scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen
      # Blocking, not continue-on-error: DEF.md § Phase 14 — verified
      # zero known vulnerabilities against this project's actual
      # dependency set before wiring this in, so blocking costs nothing
      # today and catches the first real one at merge time, not after.
      - name: pip-audit
        working-directory: backend
        run: uv run pip-audit

  backend-test:
    name: Backend / test (SQLite, coverage)
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Alembic upgrade head (SQLite smoke test)
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: uv run alembic upgrade head
      # Phase 11: the primary, fast-feedback test gate. Coverage is
      # measured and enforced here (--cov-fail-under), not duplicated in
      # the Postgres job below — that job exists to catch real dialect
      # differences (see its own comment), not to re-measure coverage.
      - name: Run tests (with coverage threshold)
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci.db
          LLM_PROVIDER: mock
        run: |
          uv run pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=95 \
            | tee /tmp/pytest-output.txt
      - name: Publish coverage summary
        if: always()
        working-directory: backend
        run: |
          {
            echo "### Backend test coverage"
            echo '```'
            grep -A 1000 "tests coverage" /tmp/pytest-output.txt | tail -n +3 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-xml
          path: backend/coverage.xml

  backend-test-postgres:
    name: Backend / test (Postgres)
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sita
          POSTGRES_PASSWORD: sita
          POSTGRES_DB: sita
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sita"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Alembic upgrade head (Postgres)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://sita:sita@localhost:5432/sita
        run: uv run alembic upgrade head
      # Resolves TODO.md's [[postgres-vs-sqlite]] open question: every test
      # using the shared db_session fixture (most of tests/unit/ plus the
      # dataset-backed integration tests) now runs against this real,
      # ephemeral Postgres container too, each in a SAVEPOINT-backed
      # transaction rolled back after the test (see tests/conftest.py) —
      # not just migrations. SQLite doesn't enforce VARCHAR length or
      # dialect-specific SQL; Phase 7 found a real bug this way (an
      # over-length prompt_version tag) that every SQLite-only run had
      # missed. TEST_POSTGRES_URL is deliberately a different variable from
      # DATABASE_URL so this can never activate outside an explicit opt-in
      # — see the comment in tests/conftest.py. Tests that build their own
      # DB engine directly (the CLI tests' local sqlite fixtures, the API
      # tests' TestClient DB override) still run, just not against Postgres
      # here — no --cov: coverage is already measured in backend-test above.
      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://sita:sita@localhost:5432/sita
          TEST_POSTGRES_URL: postgresql+psycopg://sita:sita@localhost:5432/sita
          LLM_PROVIDER: mock
        run: uv run pytest

  frontend:
    name: Frontend / lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: Prettier check
        working-directory: frontend
        run: npm run format:check
      - name: Unit/component tests
        working-directory: frontend
        run: npm run test
      # Blocking on high/critical only, unlike backend's fully-blocking
      # pip-audit — DEF.md § Phase 14: npm's ecosystem routinely carries
      # low/moderate advisories in dev-only transitive tooling (build
      # tools, not shipped code) that aren't realistically fixable on this
      # project's own timeline; gating on high+ keeps the signal real
      # without chasing noise outside this project's control.
      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Build
        working-directory: frontend
        run: npm run build
