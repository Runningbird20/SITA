worker_processes auto;

# Non-root nginx (see Dockerfile's `production` stage — DEF.md § Phase 14)
# can't write to /var/run; nginx's own /tmp-based pid/cache defaults work
# unprivileged with no extra volume/permission setup.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server {
        # >1024 — the whole point of running as a non-root user (DEF.md §
        # Phase 14): binding 80 needs CAP_NET_BIND_SERVICE or root.
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            # React Router: unknown paths fall back to index.html rather
            # than a raw nginx 404.
            try_files $uri $uri/ /index.html;
        }
    }
}
