[project]
name = "sita-backend"
version = "0.1.0"
description = "Local Security Incident Triage Agent — backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "python-json-logger>=2.0",
    "prometheus-client>=0.26.0",
    "bcrypt>=5.0.0",
    "redis>=8.1.0",
    "fpdf2>=2.8.8",
]

[dependency-groups]
dev = [
    "mutmut>=3.7.0",
    "pip-audit>=2.10.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# E501: line length handled by the formatter, not the linter.
# B008: FastAPI's `Depends(...)` default-argument pattern is idiomatic, not a bug.
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]

# Post-roadmap addition — resolves WHATNEXT.md's "No mutation testing
# anywhere" item. Deliberately scoped to the two modules WHATNEXT.md named
# as highest-stakes (correlation scoring, detection severity/window
# logic), not the whole `app` tree — coverage percentage only confirms
# code *ran*, and a full-codebase mutation run is a genuinely large,
# slow undertaking; a small, targeted pass on the modules where a silent
# logic bug would be most consequential is the signal boost the item
# itself asks for. See DEF.md § Phase 11, "Post-roadmap addition:
# mutation testing".
[tool.mutmut]
source_paths = ["app/correlation/scoring.py", "app/detection/base.py"]
also_copy = ["app/"]
pytest_add_cli_args_test_selection = [
    "tests/unit/test_correlation_scoring.py",
    "tests/unit/test_detection_rules.py",
    "tests/unit/test_detection_pipeline.py",
    "tests/unit/test_detection_base.py",
]
